name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 python3-pytest
      # The smoke suite exercises non-GTK modules and needs no display.
      - name: Run headless tests
        env:
          PATH: /usr/bin:/bin
        run: python3 -m pytest tests/
